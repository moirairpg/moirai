name: Create release

on:
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate branch
        run: |
          if [[ "${{ github.ref_name }}" != "develop" ]]; then
            echo "::error::This workflow must be run on the develop branch."
            exit 1
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout develop
        uses: actions/checkout@v6.0.2
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Check no release branch exists
        run: |
          if git ls-remote --heads origin 'release/*' | grep -q .; then
            echo "::error::A release branch already exists. Close it before creating a new one."
            exit 1
          fi

      - name: Resolve version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          NUMERIC_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NUMERIC_VERSION"
          NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
          echo "NUMERIC_VERSION=$NUMERIC_VERSION" >> $GITHUB_ENV
          echo "RC_VERSION=${NUMERIC_VERSION}-RC-SNAPSHOT" >> $GITHUB_ENV
          echo "NEXT_SNAPSHOT=${NEXT_VERSION}-SNAPSHOT" >> $GITHUB_ENV

      - name: Create release branch
        run: |
          git checkout -b release/${{ env.NUMERIC_VERSION }}
          mvn versions:set -DnewVersion=${{ env.RC_VERSION }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "create release: set version ${{ env.RC_VERSION }}"
          git push origin release/${{ env.NUMERIC_VERSION }}

      - name: Bump develop version
        run: |
          git checkout develop
          mvn versions:set -DnewVersion=${{ env.NEXT_SNAPSHOT }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "create release: bump version to ${{ env.NEXT_SNAPSHOT }}"
          git push origin develop
