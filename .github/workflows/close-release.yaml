name: Close release

on:
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  close-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate branch
        run: |
          if [[ "${{ github.ref_name }}" != release/* ]]; then
            echo "::error::This workflow must be run on a release/* branch."
            exit 1
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout release branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Install merge helper
        run: |
          cat > "$RUNNER_TEMP/git-merge.sh" <<'HELPER'
          safe_merge() {
            local ref="$1"
            local message="$2"
            local side="$3"
            shift 3
            local allowed=("$@")

            if git merge "$ref" --no-ff -m "$message"; then
              return 0
            fi

            local conflicts
            conflicts=$(git diff --name-only --diff-filter=U)

            local blocking=""
            local file
            local candidate
            local ok
            for file in $conflicts; do
              ok=false
              for candidate in "${allowed[@]}"; do
                if [ "$file" = "$candidate" ]; then
                  ok=true
                fi
              done
              if [ "$ok" = false ]; then
                blocking="${blocking}${file} "
              fi
            done

            if [ -n "$blocking" ]; then
              echo "::error::Merge conflicts outside the version file: ${blocking}. Aborting; nothing was pushed."
              git merge --abort
              exit 1
            fi

            for file in $conflicts; do
              git checkout "--${side}" -- "$file"
              git add -- "$file"
            done

            git commit --no-edit
          }
          HELPER

      - name: Verify open release branch
        run: |
          OPEN_RELEASE=$(git ls-remote --heads origin 'release/*' | sed 's|.*refs/heads/||')
          if [ "$(printf '%s\n' "$OPEN_RELEASE" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one open release branch, found: ${OPEN_RELEASE}"
            exit 1
          fi
          if [ "$OPEN_RELEASE" != "${{ github.ref_name }}" ]; then
            echo "::error::The open release branch is ${OPEN_RELEASE}, not ${{ github.ref_name }}."
            exit 1
          fi

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Finalize version on release branch
        run: |
          mvn versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false
          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "close release: set version ${{ env.VERSION }}"
          fi
          git push origin ${{ github.ref_name }}

      - name: Merge release branch into main
        run: |
          source "$RUNNER_TEMP/git-merge.sh"
          git checkout main
          git pull origin main
          safe_merge ${{ github.ref_name }} "close release: merge ${{ github.ref_name }} into main" theirs pom.xml
          git push origin main

      - name: Tag release from main
        run: |
          git tag ${{ env.VERSION }}
          git push origin ${{ env.VERSION }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create ${{ env.VERSION }} \
            --title "MoirAI ${{ env.VERSION }}" \
            --generate-notes

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ vars.DOCKER_REPO_ADDR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ env.VERSION }} \
            -t ${{ vars.DOCKER_REPO_ADDR }}/${{ vars.DOCKER_REPO }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ env.VERSION }} .
          docker push ${{ vars.DOCKER_REPO_ADDR }}/${{ vars.DOCKER_REPO }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ env.VERSION }}

      - name: Checkout develop
        run: |
          git checkout develop
          git pull origin develop

      - name: Capture develop version
        run: |
          DEVELOP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "DEVELOP_VERSION=$DEVELOP_VERSION" >> $GITHUB_ENV

      - name: Merge main into develop
        run: |
          source "$RUNNER_TEMP/git-merge.sh"
          safe_merge origin/main "close release: merge main into develop after ${{ env.VERSION }}" ours pom.xml

      - name: Restore develop version
        run: |
          mvn versions:set -DnewVersion=${{ env.DEVELOP_VERSION }} -DgenerateBackupPoms=false
          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "close release: restore develop version to ${{ env.DEVELOP_VERSION }}"
          fi
          git push origin develop

      - name: Merge main into patch branch
        run: |
          source "$RUNNER_TEMP/git-merge.sh"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          PATCH_BRANCH=$(git ls-remote --heads origin 'patch/*' | sed 's|.*refs/heads/||')
          if [ -z "$PATCH_BRANCH" ]; then
            echo "No open patch branch; nothing to back-merge."
          else
            git checkout "$PATCH_BRANCH"
            git pull origin "$PATCH_BRANCH"
            PATCH_BRANCH_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            safe_merge origin/main "close release: merge main into ${PATCH_BRANCH} after ${{ env.VERSION }}" ours pom.xml
            mvn versions:set -DnewVersion="$PATCH_BRANCH_VERSION" -DgenerateBackupPoms=false
            git add pom.xml
            if ! git diff --cached --quiet; then
              git commit -m "close release: restore ${PATCH_BRANCH} version to ${PATCH_BRANCH_VERSION}"
            fi
            git push origin "$PATCH_BRANCH"
          fi

      - name: Delete release branch
        run: |
          git push origin --delete ${{ github.ref_name }}
